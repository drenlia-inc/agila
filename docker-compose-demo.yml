# Public demo stack (DEMO_ENABLED=true). Pin project name so renaming the host
# folder does not orphan volumes.
#
# Set host-specific values in project-root .env (Compose substitutes ${VAR}):
#   ALLOWED_ORIGINS=kanban.demo.example.com
#   TENANT_DOMAIN=example.com   # unused when MULTI_TENANT=false; kept for consistency
#   POSTGRES_PASSWORD=…
#   JWT_SECRET=…
#
name: easy-kanban

services:
  agila-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        DEMO_ENABLED: "true"
        MULTI_TENANT: "false"
        # From scripts/deploy-demo.sh — `.git` is dockerignored so the build cannot resolve these
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        GIT_BRANCH: "${GIT_BRANCH:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-}"
    container_name: agila
    # Named volumes mount as root; image USER is nextjs — run as root for writes
    user: "0:0"
    ports:
      - "3221:3010"
      - "3222:3222"
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3222
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3222}
      - REDIS_URL=redis://redis:6379
      # Database — PostgreSQL (required)
      - DB_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
      # JWT / settings encryption (from project-root .env)
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      # CORS / Vite allowedHosts — set demo hostname in .env
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-kanban.demo.drenlia.com}
      # Demo countdown / hourly reset UI
      - DEMO_ENABLED=true
      - LICENSE_ENABLED=false
      # false = single-tenant Docker
      - MULTI_TENANT=false
      # Multi-tenant only (unused here; kept for consistency)
      - TENANT_DOMAIN=${TENANT_DOMAIN:-localhost}
      # No APP_VERSION — version comes from build-time server/version.json
    volumes:
      - kanban-data:/app/server/data
      - kanban-attachments:/app/server/attachments
      - kanban-avatars:/app/server/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: agila-postgres
    environment:
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  kanban-data:
    driver: local
  kanban-attachments:
    driver: local
  kanban-avatars:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
