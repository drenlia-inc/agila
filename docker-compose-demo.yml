# Pin project name so renaming the host folder (easy-kanban → agila) does not orphan volumes.
name: easy-kanban

services:
  agila-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        DEMO_ENABLED: "true"
        MULTI_TENANT: "false"
    container_name: agila
    # Named volumes were created by the old root/dev image; stay root so writes keep working.
    user: "0:0"
    ports:
      - "3221:3010"
      - "3222:3222"
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - PORT=3222
      - VITE_API_URL=http://localhost:3222
      - REDIS_URL=redis://redis:6379
      # Database configuration - PostgreSQL (required)
      - DB_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
      # JWT / settings encryption (from project-root .env — Compose substitutes ${VAR})
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      # Enable demo mode to show countdown timer for hourly resets (demo environments only)
      # Allowed origins for CORS
      - ALLOWED_ORIGINS=kanban.demo.drenlia.com
      - DEMO_ENABLED=true
      - LICENSE_ENABLED=false
      # Multi-tenant configuration (set to false for single-tenant Docker deployments)
      - MULTI_TENANT=false
      # Tenant domain (only used in multi-tenant mode, for extracting tenant ID from hostname)
      # Example: If TENANT_DOMAIN=agila.dev, then customer1.agila.dev -> tenant ID: customer1
      - TENANT_DOMAIN=agila.dev
      # Application version (optional, will override database value if set)
      - APP_VERSION=0.9-beta
    volumes:
      - kanban-data:/app/server/data
      - kanban-attachments:/app/server/attachments
      - kanban-avatars:/app/server/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: agila-postgres
    environment:
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  kanban-data:
    driver: local
  kanban-attachments:
    driver: local
  kanban-avatars:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
