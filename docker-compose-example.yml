services:
  agila-app:
    build: .
    container_name: agila
    ports:
      - "3010:3010"
      - "3222:3222"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - PORT=3222
      - VITE_API_URL=http://localhost:3222
      - REDIS_URL=redis://redis:6379
      # Database configuration - PostgreSQL (required)
      - DB_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
      # JWT / settings encryption (from project-root .env — Compose substitutes ${VAR})
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      # CORS / Vite allowedHosts — set in .env (e.g. localhost or kanban.example.com)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-localhost,127.0.0.1}
      # Demo countdown / hourly reset UI (demo environments only)
      - DEMO_ENABLED=false
      # false = single-tenant Docker; true = multi-tenant (K8s)
      - MULTI_TENANT=false
      # Multi-tenant only: hostname suffix for tenant ID (customer1.example.com → customer1)
      - TENANT_DOMAIN=${TENANT_DOMAIN:-localhost}
      # Managed Google SSO hub — public callback URL must match Cloud Console
      - AUTH_HUB_PUBLIC_URL=${AUTH_HUB_PUBLIC_URL:-}
      # Optional extra hub hosts (comma-separated URLs)
      - AUTH_HUB_PUBLIC_URLS=${AUTH_HUB_PUBLIC_URLS:-}
      # Single-tenant: browser return origin after hub callback (leave empty in multi-tenant)
      - AUTH_HUB_RETURN_ORIGIN=${AUTH_HUB_RETURN_ORIGIN:-}
      # Optional — overrides DB APP_VERSION when set
      - APP_VERSION=${APP_VERSION:-1.0.0}
      # Push agent runner (optional — enable AI in Admin → App Settings)
      - AI_RUNNER_URL=http://agila-runner:8080
      - AI_CALLBACK_BASE_URL=http://agila-app:3222
      - RUNNER_TOKEN=${RUNNER_TOKEN:-kanban-runner-dev-token-change-me}
    volumes:
      - .:/app
      - /app/node_modules
      - kanban-data:/app/server/data
      - kanban-attachments:/app/server/attachments
      - kanban-avatars:/app/server/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      agila-runner:
        condition: service_started
    restart: unless-stopped

  agila-runner:
    build: ./runner
    container_name: agila-runner
    environment:
      - PORT=8080
      - MAX_CONCURRENT=1
      - RUNNER_TOKEN=${RUNNER_TOKEN:-kanban-runner-dev-token-change-me}
    volumes:
      - ./runner/src:/app/src
    command: ["node", "--watch", "src/index.js"]
    # Internal only — no host ports
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: agila-postgres
    environment:
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  kanban-data:
    driver: local
  kanban-attachments:
    driver: local
  kanban-avatars:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
