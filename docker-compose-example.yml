services:
  agila-app:
    build: .
    container_name: agila
    ports:
      - "3010:3010"
      - "3222:3222"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
      - PORT=3222
      - VITE_API_URL=http://localhost:3222
      - REDIS_URL=redis://redis:6379
      # Database configuration - PostgreSQL (required)
      - DB_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
      # JWT / settings encryption (from project-root .env — Compose substitutes ${VAR})
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      # Allowed origins for CORS
      - ALLOWED_ORIGINS=mydomainname.tld
      # Enable demo mode to show countdown timer for hourly resets (demo environments only)
      - DEMO_ENABLED=false
      # Multi-tenant configuration (set to false for single-tenant Docker deployments)
      - MULTI_TENANT=false
      # Tenant domain (only used in multi-tenant mode, for extracting tenant ID from hostname)
      # Example: If TENANT_DOMAIN=agila.dev, then customer1.agila.dev -> tenant ID: customer1
      - TENANT_DOMAIN=agila.dev
      # Google SSO hub (managed mode). Public URL Google redirects to; must match Cloud Console.
      - AUTH_HUB_PUBLIC_URL=${AUTH_HUB_PUBLIC_URL:-https://auth.agila.dev}
      # Single-tenant only: after the hub callback, send the browser back to this origin.
      # Leave empty / unset in multi-tenant K8s (return host is {tenant}.{TENANT_DOMAIN}).
      - AUTH_HUB_RETURN_ORIGIN=${AUTH_HUB_RETURN_ORIGIN:-https://kanban.agila.dev}
      # Application version (optional, will override database value if set)
      - APP_VERSION=1.0.0
      # Push agent runner (optional — enable AI in Admin → App Settings)
      - AI_RUNNER_URL=http://agila-runner:8080
      - AI_CALLBACK_BASE_URL=http://agila-app:3222
      - RUNNER_TOKEN=${RUNNER_TOKEN:-kanban-runner-dev-token-change-me}
    volumes:
      - .:/app
      - /app/node_modules
      - kanban-data:/app/server/data
      - kanban-attachments:/app/server/attachments
      - kanban-avatars:/app/server/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      agila-runner:
        condition: service_started
    restart: unless-stopped

  agila-runner:
    build: ./runner
    container_name: agila-runner
    environment:
      - PORT=8080
      - MAX_CONCURRENT=1
      - RUNNER_TOKEN=${RUNNER_TOKEN:-kanban-runner-dev-token-change-me}
    volumes:
      - ./runner/src:/app/src
    command: ["node", "--watch", "src/index.js"]
    # Internal only — no host ports
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: agila-postgres
    environment:
      - POSTGRES_DB=kanban
      - POSTGRES_USER=kanban_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-kanban_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_user -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agila-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  kanban-data:
    driver: local
  kanban-attachments:
    driver: local
  kanban-avatars:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
